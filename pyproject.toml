[project]
name = "kellermap"
version = "0.5.0rc5"
description = "Polynomial Keller maps and certified transformations of them, working towards the Bass–Connell–Wright degree reduction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Raphael Kruse" }
]

keywords = [
    "keller maps",
    "jacobian conjecture",
    "polynomial maps",
    "polynomial automorphisms",
    "sympy",
    "computer algebra",
    "algebraic geometry"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed"
]

dependencies = [
    # Not 1.13: there PolyRing.__new__ interns its rings in a process-wide
    # _ring_cache, so two constructions with equal arguments return the same
    # object. The value semantics of this package, under which no mutable
    # object is shared with a caller, cannot be established that way. This is
    # independent of the missing PolyRing.is_element.
    "sympy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.17",
    "ipykernel>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
# The examples in docs/api.md are doctests. The reference cannot diverge from
# the implementation without the test run reporting it.
addopts = "-m 'not slow' --doctest-glob=*.md"
markers = [
    "slow: runs for minutes. Select with `pytest -m slow` or `pytest -m ''`.",
]

[tool.ruff]
line-length = 88
# Set to the lower bound from requires-python and not to the newest version.
# Otherwise the UP rules prescribe idioms that do not run on 3.10, and ruff
# would report this only once somebody adopted them.
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
]

[tool.mypy]
# The lower bound again. Otherwise mypy checks against semantics that the
# oldest supported version does not have, and lets tomllib or
# itertools.batched pass.
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/kellermap"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Full coverage is a release standard and is therefore enforced and not merely
# reported. Branches that cannot be reached, because an obligation checked
# earlier rules them out, carry `# pragma: no cover` with the reason beside
# them.
fail_under = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/kellermap"]

[tool.hatch.build.targets.sdist]
# A positive list and not a list of exclusions. Without either, the content of
# the sdist depends on the state of the working directory: after `make
# coverage`, .coverage and htmlcov/ were shipped with it.
#
# Until 0.4.0rc15 there was a list of exclusions here, and it could not keep
# the promise the comment made. It listed `.venv`, `build_env` and `min_env`.
# An environment named `.venv314`, an obvious name beside a matrix that carries
# 3.10 and 3.14, was in none of the three lists and therefore not in .gitignore
# either. `uv build` then failed with "Invalid tar file", because a virtual
# environment contains absolute symlinks. An external audit built this. A list
# of exclusions cannot be completed against names nobody has chosen yet. A
# positive list can.
#
# What is not listed here is not shipped. A new directory that belongs in the
# archive therefore has to be entered here, and `tests/test_packaging.py`
# checks that this list and the content of the built archive agree.
#
# Every entry is anchored with "/". Without the leading slash the patterns hold
# at every level, as in .gitignore, and `.gitignore` then also matched the file
# that `uv venv` places in every environment: the archive carried
# `.venv314/.gitignore`. The build succeeded, because no symlinks were left in
# it, and the promise was broken all the same.
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/.github",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.gitignore",
    "/.python-version",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    # Mathematics from another source whose licence could not be established.
    # The wheel never contained it, the source archive did, and shipping it
    # contradicted this project's own rule in AGENTS.md. Whoever has the map
    # places it under this path. Without it the tests concerned skip themselves
    # and say why.
    "tests/data.py",
]
