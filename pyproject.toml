[project]
name = "bcw-reduction"
version = "0.1.0rc2"
description = "Implementation of the Bass–Connell–Wright reduction of polynomial Keller maps."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Raphael Kruse" }
]

keywords = [
    "jacobian conjecture",
    "polynomial maps",
    "sympy",
    "computer algebra",
    "algebraic geometry"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed"
]

dependencies = [
    # Nicht 1.13: dort interniert PolyRing.__new__ seine Ringe in einem
    # prozessweiten _ring_cache, zwei Konstruktionen mit gleichen Argumenten
    # liefern dasselbe Objekt. Die Wertsemantik dieses Pakets -- kein
    # veraenderliches Objekt wird mit einem Aufrufer geteilt -- ist damit
    # nicht herstellbar, unabhaengig vom fehlenden PolyRing.is_element.
    "sympy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.17",
    "ipykernel>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
# Die Beispiele in docs/api.md sind Doctests: die Referenz kann nicht von der
# Implementierung abweichen, ohne dass der Testlauf es meldet.
addopts = "-m 'not slow' --doctest-glob=*.md"
markers = [
    "slow: Laufzeit im Minutenbereich; mit `pytest -m slow` oder `pytest -m ''` ausfuehren.",
]

[tool.ruff]
line-length = 88
# Auf die Untergrenze aus requires-python gesetzt, nicht auf die neueste
# Version: die UP-Regeln schreiben sonst Idiome vor, die auf 3.10 nicht
# laufen, und ruff meldete das erst, wenn jemand sie uebernimmt.
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
]

[tool.mypy]
# Ebenfalls die Untergrenze: sonst prueft mypy gegen Semantik, die die
# aelteste unterstuetzte Version nicht hat, und laesst etwa tomllib oder
# itertools.batched durch.
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/bcw"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/bcw"]
