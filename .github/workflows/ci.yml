# Runs unchanged on GitHub Actions and on Forgejo Actions.
#
# Portability has exactly two difficult points:
#
# 1. `uses:` is resolved by Forgejo against DEFAULT_ACTIONS_URL
#    (data.forgejo.org) and not against github.com. Only part of the actions
#    are mirrored there: actions/checkout is, astral-sh/setup-uv is not.
#    Fully qualified URLs (uses: https://...) solve this on Forgejo but are
#    invalid on GitHub. No action other than checkout is therefore used here.
#    uv is installed through its install script. If the runner image cannot
#    reach astral.sh but has a system Python, `pip install uv==${UV_VERSION}`
#    is the equivalent replacement.
#
#    checkout is pinned to v5 and not to the current v7. v4 is deprecated
#    because of Node 20. v5, v6 and v7 all run on Node 24, and for a checkout
#    without options they behave the same. v5 is the oldest of the three and
#    therefore the one most likely to be present on a Forgejo mirror that
#    lags behind. This is the same principle as for ruff and mypy, which
#    target the lower bound from requires-python rather than the newest
#    version. To harden this further, pin the commit SHA instead. The SHA is
#    identical in a Git mirror and holds on both platforms.
#
# 2. `runs-on` is a runner label. On GitHub it is set to ubuntu-latest.
#    Forgejo runners often carry `docker`. This is the value to adjust when
#    moving, once in each of the four jobs. GitHub Actions allows no env
#    reference at this place, so it cannot be collected in one spot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the slow checks.
    - cron: "0 3 * * *"

env:
  # Pinned, so that a uv release does not change the CI overnight.
  UV_VERSION: "0.11.7"

jobs:
  check:
    # Both ends of the range declared in pyproject.toml. The oldest version
    # breaks more often, the newest breaks first.
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range from requires-python.
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install ${{ matrix.python-version }}
      # Fails when uv.lock does not match pyproject.toml. This is cheaper
      # than a failing `uv sync --locked` further down.
      - run: make lock-check
      - run: uv sync --locked --python ${{ matrix.python-version }}
      # UV_PYTHON applies to every `uv run` in the Makefile. Without it,
      # `uv run` took the version from `.python-version`, that is 3.10. The
      # 3.14 job checked 3.10 for four releases while claiming 3.14. An
      # external audit measured it.
      - name: Check the interpreter is the one under test
        run: |
          uv run python -c "import sys; print(sys.version)"
          uv run python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}', sys.version"
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: make check
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      # The two gates below stand in AGENTS.md among the release checks, but
      # they stood only in the `release` target and therefore ran by hand or
      # not at all. The Makefile recorded the same finding for `reconstruct`:
      # a check nobody runs is not a check. The finding holds one level up as
      # well.
      #
      # Both run in the matrix and not in a job of their own. The coverage
      # figure can differ between interpreters as soon as a branch depends on
      # the version, and then the version on which it falls should be named.
      # Measured: 100 per cent on 3.10 and on 3.14, and the three
      # reconstructions together under ten seconds.
      - name: Coverage gate (fail_under = 100)
        run: make coverage
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      # The second computations, independent of the library. They are the only
      # gate that can find a divergence between two implementations of the
      # same formulas.
      - name: Independent reconstructions
        run: make reconstruct
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  minimum-dependencies:
    # Check the lower bound from pyproject.toml. sympy>=1.13 stood there for
    # four releases although even test collection failed on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make test-minimum

  nightly:
    # The exact determinant proof in dimension 17, about one minute.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: make check-full

  package:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make build-test
      # Read the metadata the way PyPI reads it. This stood only in the
      # `release` target, although this job builds the artefacts anyway.
      - run: make dist-check
