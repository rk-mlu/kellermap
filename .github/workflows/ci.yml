name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Naechtlich, fuer die langsamen Pruefungen.
    - cron: "0 3 * * *"

jobs:
  check:
    # Beide Enden der in pyproject.toml deklarierten Spanne. Die aelteste
    # Version bricht eher, die neueste zuerst.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: make check

  minimum-dependencies:
    # Die Untergrenze aus pyproject.toml gegenpruefen: sympy>=1.13 stand vier
    # Releases lang darin, obwohl schon die Testsammlung darauf scheiterte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: make test-minimum

  nightly:
    # Der exakte Determinantennachweis in Dimension 17, rund eine Minute.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check-full

  package:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: make build-test
