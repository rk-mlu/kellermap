# Laeuft unveraendert auf GitHub Actions und auf Forgejo Actions.
#
# Portabilitaet hat genau zwei Stolperstellen:
#
# 1. `uses:` wird von Forgejo gegen DEFAULT_ACTIONS_URL aufgeloest
#    (data.forgejo.org), nicht gegen github.com. Dort ist nur ein Teil der
#    Actions gespiegelt -- actions/checkout ja, astral-sh/setup-uv nicht.
#    Vollqualifizierte URLs (uses: https://...) loesen das auf Forgejo, sind
#    auf GitHub aber ungueltig. Deshalb wird hier ausser checkout keine
#    Action benutzt; uv kommt ueber sein Installskript. Falls das Runner-
#    Image astral.sh nicht erreicht, aber ein System-Python hat, ist
#    `pip install uv==${UV_VERSION}` der gleichwertige Ersatz.
#
#    checkout steht auf v5 und nicht auf dem aktuellen v7. v4 ist wegen
#    Node 20 abgekuendigt; v5, v6 und v7 laufen alle auf Node 24, fuer einen
#    Checkout ohne Optionen verhalten sie sich gleich. v5 ist davon die
#    aelteste und damit die, die auf einer nachhinkenden Forgejo-Spiegelung
#    am ehesten vorhanden ist -- dasselbe Prinzip wie bei ruff und mypy, die
#    auf die Untergrenze aus requires-python zielen statt auf die neueste
#    Version. Wer es haerten will, pinnt stattdessen den Commit-SHA; der ist
#    in einer Git-Spiegelung identisch und gilt auf beiden Plattformen.
#
# 2. `runs-on` ist ein Runner-Label. Auf GitHub ist ubuntu-latest gesetzt,
#    Forgejo-Runner tragen haeufig `docker`. Das ist der Wert, der beim Umzug
#    anzupassen ist -- in jedem der vier Jobs einmal. GitHub Actions erlaubt
#    an dieser Stelle keine env-Referenz, weshalb er sich nicht an einer
#    Stelle buendeln laesst.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Naechtlich, fuer die langsamen Pruefungen.
    - cron: "0 3 * * *"

env:
  # Gepinnt, damit ein uv-Release die CI nicht ueber Nacht aendert.
  UV_VERSION: "0.11.7"

jobs:
  check:
    # Beide Enden der in pyproject.toml deklarierten Spanne. Die aelteste
    # Version bricht eher, die neueste zuerst.
    strategy:
      fail-fast: false
      matrix:
        # Beide Enden der Spanne aus requires-python.
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install ${{ matrix.python-version }}
      # Faellt aus, wenn uv.lock nicht zu pyproject.toml passt -- billiger
      # als ein fehlschlagendes `uv sync --locked` weiter unten.
      - run: make lock-check
      - run: uv sync --locked --python ${{ matrix.python-version }}
      # UV_PYTHON gilt fuer jedes `uv run` im Makefile. Ohne es nahm `uv run`
      # die Version aus `.python-version`, also 3.10 -- der 3.14-Job hat vier
      # Releases lang 3.10 geprueft und 3.14 behauptet. Ein externes Audit hat
      # es gemessen.
      - name: Check the interpreter is the one under test
        run: |
          uv run python -c "import sys; print(sys.version)"
          uv run python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}', sys.version"
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - run: make check
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      # Die beiden folgenden Gates stehen in AGENTS.md unter den Freigabe-
      # Pruefungen, standen aber nur im `release`-Ziel und liefen deshalb von
      # Hand oder gar nicht. Das Makefile hat dasselbe fuer `reconstruct`
      # festgehalten -- ein Nachweis, den niemand faehrt, ist keiner -- und die
      # Feststellung gilt eine Ebene hoeher weiter.
      #
      # Beide laufen in der Matrix und nicht in einem eigenen Job. Die Quote
      # kann sich zwischen den Interpretern unterscheiden, sobald ein Zweig an
      # der Version haengt, und dann soll die Version dranstehen, auf der sie
      # faellt. Gemessen: 100 Prozent auf 3.10 und auf 3.14, und die drei
      # Rekonstruktionen zusammen unter zehn Sekunden.
      - name: Coverage gate (fail_under = 100)
        run: make coverage
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      # Die zweiten, von der Bibliothek unabhaengigen Rechnungen. Sie sind das
      # einzige Gate, das eine Abweichung zwischen zwei Implementierungen
      # derselben Formeln finden kann.
      - name: Independent reconstructions
        run: make reconstruct
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  minimum-dependencies:
    # Die Untergrenze aus pyproject.toml gegenpruefen: sympy>=1.13 stand vier
    # Releases lang darin, obwohl schon die Testsammlung darauf scheiterte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make test-minimum

  nightly:
    # Der exakte Determinantennachweis in Dimension 17, rund eine Minute.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: make check-full

  package:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make build-test
      # Die Metadaten so lesen, wie PyPI sie liest. Stand bisher nur im
      # `release`-Ziel, obwohl dieser Job die Artefakte ohnehin gebaut hat.
      - run: make dist-check
