# Laeuft unveraendert auf GitHub Actions und auf Forgejo Actions.
#
# Portabilitaet hat genau zwei Stolperstellen:
#
# 1. `uses:` wird von Forgejo gegen DEFAULT_ACTIONS_URL aufgeloest
#    (data.forgejo.org), nicht gegen github.com. Dort ist nur ein Teil der
#    Actions gespiegelt -- actions/checkout ja, astral-sh/setup-uv nicht.
#    Vollqualifizierte URLs (uses: https://...) loesen das auf Forgejo, sind
#    auf GitHub aber ungueltig. Deshalb wird hier ausser checkout keine
#    Action benutzt; uv kommt ueber sein Installskript. Falls das Runner-
#    Image astral.sh nicht erreicht, aber ein System-Python hat, ist
#    `pip install uv==${UV_VERSION}` der gleichwertige Ersatz.
#
#    checkout steht auf v5 und nicht auf dem aktuellen v7. v4 ist wegen
#    Node 20 abgekuendigt; v5, v6 und v7 laufen alle auf Node 24, fuer einen
#    Checkout ohne Optionen verhalten sie sich gleich. v5 ist davon die
#    aelteste und damit die, die auf einer nachhinkenden Forgejo-Spiegelung
#    am ehesten vorhanden ist -- dasselbe Prinzip wie bei ruff und mypy, die
#    auf die Untergrenze aus requires-python zielen statt auf die neueste
#    Version. Wer es haerten will, pinnt stattdessen den Commit-SHA; der ist
#    in einer Git-Spiegelung identisch und gilt auf beiden Plattformen.
#
# 2. `runs-on` ist ein Runner-Label. Auf GitHub ist ubuntu-latest gesetzt,
#    Forgejo-Runner tragen haeufig `docker`. Das ist der eine Wert, der beim
#    Umzug anzupassen sein kann -- er steht deshalb nur an einer Stelle,
#    im env-Block unten kommentiert.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Naechtlich, fuer die langsamen Pruefungen.
    - cron: "0 3 * * *"

env:
  # Gepinnt, damit ein uv-Release die CI nicht ueber Nacht aendert.
  UV_VERSION: "0.11.7"

jobs:
  check:
    # Beide Enden der in pyproject.toml deklarierten Spanne. Die aelteste
    # Version bricht eher, die neueste zuerst.
    strategy:
      fail-fast: false
      matrix:
        # Beide Enden der Spanne aus requires-python.
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install ${{ matrix.python-version }}
      # Faellt aus, wenn uv.lock nicht zu pyproject.toml passt -- billiger
      # als ein fehlschlagendes `uv sync --locked` weiter unten.
      - run: make lock-check
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: make check

  minimum-dependencies:
    # Die Untergrenze aus pyproject.toml gegenpruefen: sympy>=1.13 stand vier
    # Releases lang darin, obwohl schon die Testsammlung darauf scheiterte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make test-minimum

  nightly:
    # Der exakte Determinantennachweis in Dimension 17, rund eine Minute.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: make check-full

  package:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/${UV_VERSION}/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.10
      - run: make build-test
